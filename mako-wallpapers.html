		<meta

		<link

		/>
	</head>

	<body class="mako">
		<rama-loading
			blocking-request="https://cdn.jsdelivr.net/gh/nano-grid/nano-grid@v5.3.1/dist/nanogrid.js"
		>
		</rama-loading>

		<nav>
			<nn-caja padding="1rem">
				<div class="nav-controls">
					<ul>
						<li>
							<a
								target="_self"
								href="/"
								class="logo"
							>
								Rama
							</a>
						</li>

						<li class="searchbar-area"></li>

						<li>
							<a
								target="_self"
								href="mako.html"
							>
								Mako
							</a>
						</li>
						<li>
							<a
								target="_self"
								href="txori.html"
							>
								Txori
							</a>
						</li>
						<li>
							<a
								target="_self"
								href="tui.html"
							>
								Tui
							</a>
						</li>
					</ul>
				</div>
			</nn-caja>
		</nav>

		<main>
			<header>
				<img
					src="https://raw.githubusercontent.com/rama-io/mako/master/docs/img/mako_header_1200x630.svg"
				/>
			</header>

			<nn-caja
				max-width="1000px"
				padding="1rem"
			>
				<h1>Wallpapers</h1>

				<p>
					Mako ships with a set of handcrafted wallpapers. There's no built-in
					picker to keep the launcher lean, so here they are — preview them,
					find your favorite, then set it from the app's wallpaper settings.
				</p>

				<label class="mockup-toggle">
					<input
						type="checkbox"
						id="mockup-toggle"
						checked
					/>
					<span>Show Overlay</span>
				</label>

				<div
					class="carousel"
					id="carousel"
				>
					<button
						class="carousel-arrow carousel-prev"
						id="carousel-prev"
						aria-label="Previous"
					>
						‹
					</button>

					<div class="carousel-viewport">
						<div
							class="carousel-track"
							id="carousel-track"
						></div>
					</div>

					<button
						class="carousel-arrow carousel-next"
						id="carousel-next"
						aria-label="Next"
					>
						›
					</button>
				</div>
			</nn-caja>
		</main>

		<div
			id="lightbox"
			class="lightbox hidden"
		>
			<span class="lightbox-close">&times;</span>
			<img
				id="lightbox-img"
				src=""
				alt=""
			/>
		</div>

		<rama-footer></rama-footer>

		<script>
			;(function () {
				var carousel = document.getElementById('carousel')
				var track = document.getElementById('carousel-track')
				var prevBtn = document.getElementById('carousel-prev')
				var nextBtn = document.getElementById('carousel-next')
				var lightbox = document.getElementById('lightbox')
				var lightboxImg = document.getElementById('lightbox-img')
				var lightboxClose = document.querySelector('.lightbox-close')
				var mockupToggle = document.getElementById('mockup-toggle')

				/* PLEASE INCREASE THIS VALUE IF YOU ADD MORE WALLPAPERS, IF YOU INCREASE MORE IT WILL SHOW THE OVERLAY ONLY */
				var WALLPAPER_COUNT = 3
				var currentIndex = 0
				var itemsPerView = window.innerWidth >= 992 ? 3 : 1
				var gap = 24

				function buildSlides() {
					for (var i = 1; i <= WALLPAPER_COUNT; i++) {
						var path = 'img/wallpapers/wallpaper_' + i + '.png'
						var slide = document.createElement('div')
						slide.className = 'carousel-slide'
						slide.dataset.wallpaper = path

						var preview = document.createElement('div')
						preview.className = 'wallpaper-preview'
						preview.style.backgroundImage = "url('" + path + "')"

						var overlay = document.createElement('img')
						overlay.src = 'img/wallpapers/mockup.png'
						overlay.alt = ''
						preview.appendChild(overlay)

						var name = document.createElement('span')
						name.className = 'wallpaper-name'
						name.textContent = 'Wallpaper ' + i

						var btn = document.createElement('a')
						btn.href = path
						btn.download = ''
						btn.className = 'nn-btn'
						btn.textContent = 'Download'

						slide.appendChild(preview)
						slide.appendChild(name)
						slide.appendChild(btn)
						track.appendChild(slide)
					}
				}

				buildSlides()
				var slides = track.children
				var total = slides.length

				function getSlideWidth() {
					var viewport = track.parentElement
					var gapTotal = gap * (itemsPerView - 1)
					return (viewport.offsetWidth - gapTotal) / itemsPerView
				}

				function updateArrowsVisibility() {
					var allFit = total <= itemsPerView
					carousel.classList.toggle('arrows-hidden', allFit)
				}

				function render() {
					var slideW = getSlideWidth()
					for (var i = 0; i < total; i++) {
						slides[i].style.width = slideW + 'px'
					}
					var offset = currentIndex * (slideW + gap)
					track.style.transform = 'translateX(-' + offset + 'px)'

					prevBtn.disabled = currentIndex === 0
					nextBtn.disabled = currentIndex >= total - itemsPerView

					updateArrowsVisibility()
				}

				prevBtn.addEventListener('click', function () {
					if (currentIndex > 0) {
						currentIndex--
						render()
					}
				})

				nextBtn.addEventListener('click', function () {
					if (currentIndex < total - itemsPerView) {
						currentIndex++
						render()
					}
				})

				window.addEventListener('resize', function () {
					var newPerView = window.innerWidth >= 992 ? 3 : 1
					if (newPerView !== itemsPerView) {
						itemsPerView = newPerView
						currentIndex = 0
					}
					render()
				})

				mockupToggle.addEventListener('change', function () {
					carousel.classList.toggle('hide-mockup', !this.checked)
				})

				function closeLightbox() {
					lightbox.classList.add('hidden')
				}

				for (var i = 0; i < total; i++) {
					;(function (slide) {
						slide.addEventListener('click', function (e) {
							if (e.target.closest('.nn-btn')) return
							lightboxImg.src = this.dataset.wallpaper
							lightbox.classList.remove('hidden')
						})
					})(slides[i])
				}

				lightbox.addEventListener('click', function (e) {
					if (e.target === this) closeLightbox()
				})

				lightboxClose.addEventListener('click', closeLightbox)

				document.addEventListener('keydown', function (e) {
					if (e.key === 'Escape') closeLightbox()
				})

				render()
			})()
		</script>
	</body>
</html>
